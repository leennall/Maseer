<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسير | تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body>

  <main class="auth-container">
    <section class="auth-card">

      <a href="index.html" class="brand" aria-label="الصفحة الرئيسية">
        <img src="logo.png" alt="شعار مسير" class="logo">
      </a>

      <h1>تسجيل الدخول</h1>
      <p class="welcome">مرحبًا بك في مسير</p>
      <p class="description">
        اكتشف الحرف السعودية التقليدية
      </p>

      <form id="loginForm">

        <label for="loginEmail">البريد الإلكتروني</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="أدخل بريدك الإلكتروني"
          autocomplete="email"
          required
        >

        <label for="loginPassword">كلمة المرور</label>
        <div class="password-field">
          <input
            type="password"
            id="loginPassword"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
            required
          >
          <button type="button"
                  class="toggle-password"
                  data-target="loginPassword"
                  aria-label="إظهار كلمة المرور">
            إظهار
          </button>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="rememberMe">
            تذكرني
          </label>
        </div>

        <p id="message" class="message"
           role="status" aria-live="polite"></p>

        <button type="submit" class="main-btn">
          تسجيل الدخول
        </button>

      </form>

      <div class="separator">أو</div>

      <p class="switch-page">
        ليس لديك حساب؟
        <a href="register.html">إنشاء حساب جديد</a>
      </p>

      <a class="site-back" href="index.html">العودة إلى الرئيسية</a>

    </section>
  </main>

</body>
</html>
